apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - inference-api.yaml
  - prometheus.yaml
  - alertmanager.yaml
  - grafana.yaml
  - loki.yaml
  - jaeger.yaml
  - otel-collector.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=configs/prometheus.yml
  - name: prometheus-rules
    files:
      - ai-quality.yml=configs/prometheus-rules/ai-quality.yml
      - slo-burn-rate.yml=configs/prometheus-rules/slo-burn-rate.yml
  - name: alertmanager-config
    files:
      - alertmanager.yml=configs/alertmanager/alertmanager.yml
  - name: grafana-datasources
    files:
      - datasources.yml=configs/grafana-datasources/datasources.yml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yml=configs/grafana-providers/dashboards.yml
  - name: grafana-dashboards
    files:
      - ai-service-overview.json=configs/grafana-dashboards/ai-service-overview.json
      - cost-and-tokens.json=configs/grafana-dashboards/cost-and-tokens.json
      - slo-burn-rate.json=configs/grafana-dashboards/slo-burn-rate.json
      - full-stack-dashboard.json=configs/grafana-dashboards/full-stack-dashboard.json
  - name: loki-config
    files:
      - loki-config.yaml=configs/loki/loki-config.yaml
  - name: otel-config
    files:
      - otel-config.yaml=configs/otel/otel-config.yaml

generatorOptions:
  disableNameSuffixHash: true
